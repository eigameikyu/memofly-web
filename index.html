<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>プロフ帳に書く｜MemoFly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&family=Yomogi&family=DotGothic16&family=Caveat:wght@500&family=Noto+Sans+SC:wght@500&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3a3340; --sub:#8a8390; --pink:#e8749a; --bg:#f6f4f1; --card:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"M PLUS Rounded 1c", -apple-system, "Hiragino Sans", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
  .wrap { max-width:560px; margin:0 auto; padding:14px 14px 0; }
  header { text-align:center; padding:10px 0 6px; }
  .brand { font-weight:800; font-size:15px; letter-spacing:.5px; color:var(--sub); }
  .brand b { color:var(--pink); }
  h1 { font-size:20px; margin:6px 0 2px; font-weight:800; }
  .lead { font-size:13px; color:var(--sub); margin:0 0 10px; }
  .paper { position:relative; width:100%; border-radius:12px; overflow:hidden; box-shadow:0 6px 24px rgba(60,40,60,.14); background:#eee; }
  .paper canvas { display:block; width:100%; height:auto; }
  .paper .photoHit { position:absolute; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .paper .photoHit span { font-size:12px; font-weight:700; color:#8a93a6; background:rgba(255,255,255,.75); padding:4px 10px; border-radius:10px; }
  .panel { background:var(--card); border-radius:16px; padding:14px; margin-top:14px; box-shadow:0 2px 10px rgba(60,40,60,.06); }
  .row { display:flex; gap:10px; align-items:flex-start; margin:0 0 10px; }
  .row label { flex:0 0 38%; font-size:13px; font-weight:700; padding-top:11px; line-height:1.35; color:#4a4350; }
  .row .in { flex:1; }
  input[type=text], textarea { width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1.5px solid #e6e1e8; border-radius:12px; background:#faf8fb; color:var(--ink); outline:none; }
  input[type=text]:focus, textarea:focus { border-color:var(--pink); background:#fff; }
  textarea { resize:none; min-height:64px; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg button { font:inherit; font-size:14px; font-weight:700; padding:8px 14px; border-radius:999px; border:1.5px solid #e6e1e8; background:#faf8fb; color:#6a6370; }
  .seg button.on { background:var(--pink); border-color:var(--pink); color:#fff; }
  .fonts { display:flex; gap:6px; overflow-x:auto; padding:2px 0 6px; }
  .fonts button { font-size:14px; padding:7px 12px; border-radius:999px; border:1.5px solid #e6e1e8; background:#fff; white-space:nowrap; }
  .fonts button.on { border-color:var(--pink); color:var(--pink); }
  .actions { position:sticky; bottom:0; padding:12px 0 calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 70%, transparent); }
  .big { width:100%; font:inherit; font-weight:800; font-size:17px; padding:15px; border:0; border-radius:16px; background:#2a2430; color:#fff; box-shadow:0 6px 18px rgba(40,30,50,.25); }
  .big:disabled { opacity:.5; }
  .small { width:100%; font:inherit; font-weight:700; font-size:14px; padding:12px; border:1.5px solid #e6e1e8; border-radius:14px; background:#fff; color:#4a4350; margin-top:8px; }
  .hint { font-size:12px; color:var(--sub); text-align:center; margin:8px 0 0; line-height:1.5; }
  .result { display:none; }
  .result img { width:100%; border-radius:12px; box-shadow:0 6px 24px rgba(60,40,60,.14); }
  footer { text-align:center; font-size:12px; color:var(--sub); margin-top:26px; line-height:1.7; }
  footer a { color:var(--pink); font-weight:700; text-decoration:none; }
  .err { color:#c0392b; font-weight:700; text-align:center; padding:30px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Memo<b>Fly</b></div>
    <h1 id="title">プロフ帳に書いてね</h1>
    <p class="lead" id="lead"></p>
  </header>

  <div class="paper" id="paper">
    <canvas id="cv" width="1024" height="1536"></canvas>
    <div class="photoHit" id="photoHit" hidden><span id="photoHint"></span></div>
  </div>
  <input type="file" id="photoFile" accept="image/*" hidden>

  <div class="panel" id="form"></div>

  <div class="actions" id="actions">
    <button class="big" id="send"></button>
    <p class="hint" id="sendHint"></p>
  </div>

  <div class="panel result" id="result">
    <img id="resultImg" alt="">
    <p class="hint" id="resultHint"></p>
    <a class="small" id="dl" style="display:block;text-align:center;text-decoration:none"></a>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(async function () {
  // ---------- ことば（書く人のブラウザの言語） ----------
  const UI = {
    ja: { title: n => n ? `${n}のプロフ帳に書いてね` : 'プロフ帳に書いてね', lead: '空欄をうめて、写真も貼れます。できたら「送り返す」で画像にして、LINEなどで返してね。', photo: '＋ 写真を貼る', photoChange: '写真を変える',
          send: '送り返す（画像にする）', sendHint: '書いた内容はどこにも送られません。この画面の中で画像になります。', done: '画像ができました。共有画面が出なかったときは、画像を長押しして保存してね。', dl: '画像を保存', font: '文字',
          foot: 'このプロフ帳は「MemoFly（メモフライ）」で作られました。<br>自分のプロフ帳をつくる・友達に書いてもらう →', app: 'App Store', lang: 'ことば', to: 'To' },
    en: { title: n => n ? `Fill in ${n}'s profile book` : 'Fill in a profile card', lead: 'Fill in the blanks and add a photo. Tap "Send back" to turn it into an image and share it.', photo: '+ Add photo', photoChange: 'Change photo',
          send: 'Send back (make image)', sendHint: 'Nothing is uploaded. The image is made right here on your phone.', done: 'Your card is ready. If the share sheet did not open, press and hold the image to save it.', dl: 'Save image', font: 'Font',
          foot: 'Made with MemoFly.<br>Make your own profile book and have friends fill it in →', app: 'App Store', lang: 'Language', to: 'To' },
    zh: { title: n => n ? `给${n}的同学录写一页吧` : '写一页同学录', lead: '填好空格，也可以贴照片。完成后点“发回去”，就会变成图片。', photo: '＋ 贴照片', photoChange: '换照片',
          send: '发回去（生成图片）', sendHint: '内容不会上传到任何地方，图片在你的手机里生成。', done: '图片做好了。如果没有弹出分享，请长按图片保存。', dl: '保存图片', font: '字体',
          foot: '由「MemoFly」制作。<br>做自己的同学录、请朋友来写 →', app: 'App Store', lang: '语言', to: 'To' },
    ru: { title: n => n ? `Заполни анкету для ${n}` : 'Заполни анкету', lead: 'Ответь на вопросы, можно добавить фото. Потом нажми «Отправить» — получится картинка.', photo: '+ Добавить фото', photoChange: 'Сменить фото',
          send: 'Отправить (сделать картинку)', sendHint: 'Ничего никуда не загружается. Картинка делается прямо в телефоне.', done: 'Готово! Если окно «Поделиться» не открылось, удержи картинку, чтобы сохранить.', dl: 'Сохранить картинку', font: 'Шрифт',
          foot: 'Сделано в MemoFly.<br>Заведи свою анкету и попроси друзей заполнить →', app: 'App Store', lang: 'Язык', to: 'Для' },
    de: { title: n => n ? `Schreib in ${n}s Freundebuch` : 'Schreib ins Freundebuch', lead: 'Füll die Felder aus, ein Foto geht auch. Dann „Zurückschicken“ – daraus wird ein Bild.', photo: '+ Foto einfügen', photoChange: 'Foto ändern',
          send: 'Zurückschicken (Bild machen)', sendHint: 'Nichts wird hochgeladen. Das Bild entsteht direkt auf deinem Handy.', done: 'Fertig! Wenn sich das Teilen-Fenster nicht öffnet, halte das Bild gedrückt, um es zu speichern.', dl: 'Bild speichern', font: 'Schrift',
          foot: 'Gemacht mit MemoFly.<br>Eigenes Freundebuch anlegen und Freunde schreiben lassen →', app: 'App Store', lang: 'Sprache', to: 'Für' },
  };
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  const q = new URLSearchParams(location.search);
  const uiLang = UI[q.get('ui')] ? q.get('ui') : (UI[nav] ? nav : 'en');
  const T = UI[uiLang];
  const APP_URL = 'https://apps.apple.com/app/id6833872535';
  const $ = id => document.getElementById(id);

  const hashQ0 = new URLSearchParams(location.hash.replace(/^#/, '').replace(/;/g, '&'));
  const to = (q.get('to') || hashQ0.get('to') || '').slice(0, 24);
  $('title').textContent = T.title(to);
  $('lead').textContent = T.lead;
  $('send').textContent = T.send;
  $('sendHint').textContent = T.sendHint;
  $('resultHint').textContent = T.done;
  $('dl').textContent = T.dl;
  $('foot').innerHTML = `${T.foot} <a href="${APP_URL}" target="_blank" rel="noopener">${T.app}</a>`;

  // ---------- カード ----------
  let data;
  try {
    data = await (await fetch('cards.json', { cache: 'no-cache' })).json();
  } catch (e) {
    $('form').innerHTML = `<div class="err">cards.json</div>`; return;
  }
  // URL にカードの指定がないとき（プレビュー用）は、上に選ぶ欄を出す
  const hashQ = new URLSearchParams(location.hash.replace(/^#/, '').replace(/;/g, '&'));
  const cardId = q.get('c') || hashQ.get('c');
  if (!cardId) {
    const sel = document.createElement('select');
    sel.style.cssText = 'font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1.5px solid #e6e1e8;margin:0 0 10px;max-width:100%';
    for (const c of data.cards) { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; sel.appendChild(o); }
    sel.onchange = () => { location.search = '?c=' + sel.value + (to ? '&to=' + encodeURIComponent(to) : ''); };
    $('lead').after(sel);
  }
  const card = data.cards.find(c => c.id === cardId) || data.cards[0];
  const W = card.size[0], H = card.size[1];
  const S = W / 360;                       // アプリの用紙座標（短い辺=360）→ 画像のピクセル
  const img = new Image();
  img.src = `cards/${card.id}.jpg`;
  await new Promise(r => { img.onload = r; img.onerror = r; });

  // 書体：日本語は5種類から、ロシアは手書きの欧文、中国は簡体字
  const FONTS = {
    ja: [['klee', 'えんぴつ', '"Klee One"'], ['hachimaru', '平成まる文字', '"Hachi Maru Pop"'], ['mochiy', 'ぽってり', '"Mochiy Pop One"'], ['yomogi', 'ゆる手書き', 'Yomogi'], ['dot', 'ドット', 'DotGothic16']],
    ru: [['caveat', 'Caveat', 'Caveat'], ['klee', 'Klee', '"Klee One"']],
    zh: [['noto', '黑体', '"Noto Sans SC"'], ['klee', 'Klee', '"Klee One"']],
    de: [['klee', 'Klee', '"Klee One"'], ['caveat', 'Caveat', 'Caveat'], ['yomogi', 'Yomogi', 'Yomogi']],
    en: [['klee', 'Klee', '"Klee One"'], ['caveat', 'Caveat', 'Caveat'], ['yomogi', 'Yomogi', 'Yomogi']],
  };
  const fontList = FONTS[card.lang] || FONTS.en;
  let fontId = fontList[0][0];
  const fontFamily = () => (fontList.find(f => f[0] === fontId) || fontList[0])[2];
  const JP = /[　-ヿ㐀-鿿＀-￯]/;
  // 項目名を重ねるカード（ドイツ）の項目名の言語
  let labelLang = card.langs ? (card.langs.includes(uiLang) ? uiLang : (card.langs.includes('en') ? 'en' : card.langs[0])) : card.lang;
  const label = key => (data.labels[labelLang] || {})[key] || (data.labels.en || {})[key] || key;

  const values = {};
  let photo = null;   // Image

  // ---------- 入力欄 ----------
  const form = $('form');
  const items = card.blanks
    ? card.blanks.map(b => ({ key: b.key, label: b.label, kind: b.kind, options: b.options && b.options.map(o => o.value), max: b.kind === 'area' ? Math.max(48, (b.lines || 2) * 36) : 24 }))
    : [...card.rows.flatMap(r => r.fields.map(f => ({ key: f.key, label: label(f.key), kind: 'line', max: 24 }))),
       ...(card.message ? [{ key: card.message.key, label: label(card.message.key), kind: 'area', max: 48 }] : [])];

  function buildForm() {
    form.innerHTML = '';
    if (card.langs && card.langs.length > 1) {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<label>${T.lang}</label><div class="in seg" id="langSeg"></div>`;
      form.appendChild(row);
      const seg = row.querySelector('#langSeg');
      for (const l of card.langs) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = { de: 'Deutsch', en: 'English', ja: '日本語', ru: 'Русский', zh: '中文' }[l] || l;
        if (l === labelLang) b.classList.add('on');
        b.onclick = () => { labelLang = l; buildForm(); draw(); };
        seg.appendChild(b);
      }
    }
    for (const it of items) {
      const row = document.createElement('div'); row.className = 'row';
      const lab = document.createElement('label'); lab.textContent = card.langs ? label(it.key) : it.label; row.appendChild(lab);
      const box = document.createElement('div'); box.className = 'in'; row.appendChild(box);
      if (it.kind === 'choice') {
        box.className = 'in seg';
        for (const o of it.options) {
          const b = document.createElement('button'); b.type = 'button'; b.textContent = o;
          if (values[it.key] === o) b.classList.add('on');
          b.onclick = () => { values[it.key] = values[it.key] === o ? '' : o; buildForm(); draw(); };
          box.appendChild(b);
        }
      } else {
        const el = document.createElement(it.kind === 'area' ? 'textarea' : 'input');
        if (it.kind !== 'area') el.type = 'text';
        el.maxLength = it.max; el.value = values[it.key] || ''; el.autocomplete = 'off';
        el.oninput = () => { values[it.key] = el.value; scheduleDraw(); };
        box.appendChild(el);
      }
      form.appendChild(row);
    }
    if (fontList.length > 1) {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<label>${T.font}</label><div class="in fonts" id="fonts"></div>`;
      form.appendChild(row);
      const fs = row.querySelector('#fonts');
      for (const [id, name, fam] of fontList) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = name; b.style.fontFamily = fam;
        if (id === fontId) b.classList.add('on');
        b.onclick = () => { fontId = id; buildForm(); draw(); };
        fs.appendChild(b);
      }
    }
  }
  buildForm();

  // ---------- 写真 ----------
  const photoHit = $('photoHit');
  if (card.photo) {
    const p = card.photo;
    photoHit.hidden = false;
    const place = () => {
      const k = $('paper').clientWidth / W;
      Object.assign(photoHit.style, { left: p.x * k + 'px', top: p.y * k + 'px', width: p.w * k + 'px', height: p.h * k + 'px' });
    };
    place(); addEventListener('resize', place);
    $('photoHint').textContent = T.photo;
    photoHit.onclick = () => $('photoFile').click();
    $('photoFile').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const url = URL.createObjectURL(f);
      const im = new Image();
      im.onload = () => { photo = im; $('photoHint').textContent = T.photoChange; draw(); };
      im.src = url;
    };
  }

  // ---------- 描く ----------
  const cv = $('cv'); const ctx = cv.getContext('2d');
  let timer = 0;
  function scheduleDraw() { clearTimeout(timer); timer = setTimeout(draw, 60); }

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  // 枠に収まるように字を小さくする（アプリの adjustsFontSizeToFit と同じ考え）
  function fitLines(text, fam, size, maxW, maxLines, minScale) {
    const wrap = sz => {
      ctx.font = `${sz}px ${fam}`;
      const lines = [];
      for (const para of String(text).split('\n')) {
        let cur = '';
        for (const ch of para) {
          const t = cur + ch;
          if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = ch; } else cur = t;
        }
        lines.push(cur);
      }
      return lines;
    };
    let sz = size;
    for (;;) {
      const lines = wrap(sz);
      if (lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW)) return { lines, size: sz };
      if (sz <= size * minScale) { return { lines: lines.slice(0, maxLines), size: sz }; }
      sz -= Math.max(0.5, size * 0.04);
    }
  }

  function drawText(text, x, y, w, h, opt) {
    // x,y,w,h は画像のピクセル。opt.size は画像のピクセル、opt.lines 行数、opt.center、opt.lh 行の高さ、opt.valign 'center'|'top'
    if (!text) return;
    const fam = opt.family;
    const { lines, size } = fitLines(text, fam, opt.size, w, opt.lines || 1, opt.minScale || 0.6);
    const lh = opt.lh ? opt.lh * (size / opt.size) : size * 1.28;
    ctx.font = `${size}px ${fam}`; ctx.fillStyle = opt.color; ctx.textBaseline = 'middle';
    ctx.textAlign = opt.center ? 'center' : 'left';
    const total = lh * lines.length;
    let ty = opt.valign === 'top' ? y + lh / 2 : y + h / 2 - total / 2 + lh / 2;
    for (const l of lines) { ctx.fillText(l, opt.center ? x + w / 2 : x, ty); ty += lh; }
  }

  function draw() {
    cv.width = W; cv.height = H;
    ctx.clearRect(0, 0, W, H);
    if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, W, H); else { ctx.fillStyle = card.swatch; ctx.fillRect(0, 0, W, H); }
    // 写真（枠いっぱいに切り抜き）
    if (card.photo && photo) {
      const p = card.photo; ctx.save(); roundRect(p.x, p.y, p.w, p.h, 7 * S / 2.84); ctx.clip();
      const r = Math.max(p.w / photo.width, p.h / photo.height);
      const dw = photo.width * r, dh = photo.height * r;
      ctx.drawImage(photo, p.x + (p.w - dw) / 2, p.y + (p.h - dh) / 2, dw, dh); ctx.restore();
    }
    const color = card.color;
    if (card.blanks) {
      for (const b of card.blanks) {
        const v = values[b.key] || '';
        if (b.kind === 'choice') {
          const o = b.options.find(x => x.value === v); if (!o) continue;
          ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          if (b.mark === 'check') {
            const s = o.w; ctx.lineWidth = 2 * S; ctx.beginPath();
            ctx.moveTo(o.x - s * .2 + s * .35, o.y - s * .45 + s * .9); ctx.lineTo(o.x - s * .2 + s * .7, o.y - s * .45 + s * 1.3); ctx.lineTo(o.x - s * .2 + s * 1.45, o.y - s * .45 + s * .2); ctx.stroke();
          } else {
            ctx.lineWidth = 1.6 * S; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2, o.w / 2 + 1 * S, o.h / 2, 0, 0, Math.PI * 2); ctx.stroke();
          }
          continue;
        }
        if (!v) continue;
        const area = b.kind === 'area', lines = area ? (b.lines || 2) : 1, centered = b.align === 'center';
        // アプリと同じ大きさの計算（用紙座標で計算して画像のピクセルに直す）
        const h = b.h / S, w = b.w / S;
        const useHand = card.answerFont && !JP.test(v);
        const scale = useHand ? 1.3 : 1;
        let size = scale * (!area ? Math.min(13, h * 0.74) : centered ? Math.min(12, h * 0.5, w / 4.2) : Math.min(13, (h / lines) * 0.72));
        const lh = area && !centered ? (h / lines) * 0.98 : size * 1.28;
        const fam = useHand ? 'Caveat' : (card.answerFont && JP.test(v) ? '"Klee One"' : fontFamily());
        drawText(v, b.x + 3 * S, b.y, b.w - 6 * S, b.h, { family: fam, size: size * S, lh: lh * S, lines, center: centered, color, valign: area && !centered ? 'top' : 'center' });
      }
    } else {
      // 項目名を重ねるカード（ドイツ）：「項目名: 答え」
      const colon = labelLang === 'ja' ? '：' : ':';
      for (const row of card.rows) for (const f of row.fields) {
        const top = row.lineY - 23 * S, hh = 22 * S;
        ctx.font = `700 ${8.6 * S}px "M PLUS Rounded 1c"`; ctx.fillStyle = card.labelColor; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
        const lab = label(f.key) + colon; ctx.fillText(lab, f.x, top + hh - 3.5 * S - 1 * S);
        const lw = ctx.measureText(lab).width + 4 * S;
        const v = values[f.key] || ''; if (!v) continue;
        const { lines, size } = fitLines(v, fontFamily(), 13 * S, f.w - lw, 1, 0.5);
        ctx.font = `${size}px ${fontFamily()}`; ctx.fillStyle = color; ctx.fillText(lines[0], f.x + lw, top + hh - 3.5 * S);
      }
      if (card.message) {
        const m = card.message;
        ctx.font = `700 ${7.4 * S}px "M PLUS Rounded 1c"`; ctx.fillStyle = card.labelColor; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(label(m.key), m.x + m.w / 2, m.y + 7 * S);
        const v = values[m.key] || '';
        if (v) drawText(v, m.x + 6 * S, m.y + 18 * S, m.w - 12 * S, m.h - 24 * S, { family: fontFamily(), size: 12 * S, lh: 17 * S, lines: 4, center: true, color, minScale: 0.6 });
      }
    }
    // 右下の「メモびより」と左下の「To ○○」
    // 右下にまとめて置く（アプリの画像と同じ位置）
    let rx = W - 10 * S;
    const tag = (text) => {
      ctx.font = `700 ${7.5 * S}px "M PLUS Rounded 1c"`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      const tw = ctx.measureText(text).width + 14 * S, th = 15 * S, y = H - 12 * S - th;
      const x = rx - tw; rx = x - 5 * S;
      ctx.fillStyle = 'rgba(255,255,255,0.82)'; roundRect(x, y, tw, th, th / 2); ctx.fill();
      ctx.fillStyle = '#8C7A80'; ctx.fillText(text, x + 7 * S, y + th / 2 + 0.5 * S);
    };
    tag('MemoFly');
    if (to) tag(`${T.to} ${to}`);
  }
  await document.fonts.ready;
  draw();
  // 書体が読み込まれたら描き直す
  document.fonts.addEventListener('loadingdone', draw);

  // ---------- 送り返す ----------
  $('send').onclick = async () => {
    $('send').disabled = true;
    try { await Promise.all([...fontList.map(f => document.fonts.load(`16px ${f[2]}`)), document.fonts.load('700 16px "M PLUS Rounded 1c"')]); } catch (e) {}
    draw();
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const name = `memofly-profile${to ? '-' + to : ''}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    const url = URL.createObjectURL(blob);
    $('resultImg').src = url; $('dl').href = url; $('dl').download = name;
    $('result').style.display = 'block';
    $('result').scrollIntoView({ behavior: 'smooth' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'MemoFly' }); } catch (e) {}
    }
    $('send').disabled = false;
  };
})();
</script>
</body>
</html>
